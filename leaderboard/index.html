<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cumometer Leaderboard</title>
<meta name="description" content="The Cumometer leaderboard.">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/styles.css">
<script type="module" src="/app.js"></script>
</head>
<body>
<header class="bar">
    <a class="mark" href="/"><img src="/favicon.svg" alt="" width="18" height="18">Cumometer</a>
    <nav>
        <button class="lang" type="button"></button>
        <a href="https://github.com/evrytests-maker/Omega-pizdec-big-dick" target="_blank" rel="noopener">GitHub</a>
    </nav>
</header>

<main>
    <h1 data-t="title"></h1>
    <p class="summary"></p>

    <div class="seg" role="tablist">
        <button type="button" role="tab" data-board="omega-pizdec">Omega-pizdec</button>
        <button type="button" role="tab" data-board="base">Base</button>
    </div>

    <label class="search"><svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="M13 13l4 4"/></svg><input type="search" autocomplete="off" spellcheck="false"></label>

    <ol class="list" aria-live="polite" hidden></ol>
    <p class="note"></p>
</main>

<footer>
    <p class="updated"></p>
</footer>
</body>
</html>
